name = "rrg-indian-sectors-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://rrg-indian-sectors.pages.dev,http://localhost:4173"

# KV Cache Binding for computed RRG Data
# Execute `npx wrangler kv:namespace create RRG_CACHE` and replace the id below before deploying:
[[kv_namespaces]]
binding = "RRG_CACHE"
id = "e262330170914f6e883a37004c9e0d91"
preview_id = "96c9aa25d7044fe8968e2edcbc2f475a"

# Cron Trigger for scheduled refresh (Every Monday to Friday at 18:00 UTC / 11:30 PM IST)
[triggers]
crons = ["0 18 * * 1-5"]
